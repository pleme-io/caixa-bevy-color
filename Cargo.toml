"[package]\nname = \"bevy_color\"\nversion = \"0.19.0-dev\"\npublish = false\nedition = \"2024\"\ndescription = \"Types for representing and manipulating color values\"\nhomepage = \"https://bevy.org\"\nrepository = \"https://github.com/bevyengine/bevy\"\nlicense = \"MIT OR Apache-2.0\"\nkeywords = [\"bevy\", \"color\"]\nrust-version = \"1.85.0\"\n\n[dependencies]\nbevy_math = { path = \"../bevy_math\", version = \"0.19.0-dev\", default-features = false, features = [\n  \"curve\",\n] }\nbevy_reflect = { path = \"../bevy_reflect\", version = \"0.19.0-dev\", default-features = false, optional = true }\nbytemuck = { version = \"1\", features = [\"derive\"] }\nserde = { version = \"1.0\", features = [\n  \"derive\",\n], default-features = false, optional = true }\nthiserror = { version = \"2\", default-features = false }\nderive_more = { version = \"2\", default-features = false, features = [\"from\"] }\nwgpu-types = { version = \"29.0.3\", default-features = false, optional = true }\nencase = { version = \"0.12\", default-features = false, optional = true }\n\n[features]\ndefault = [\"std\", \"bevy_reflect\", \"encase\"]\nstd = [\n  \"alloc\",\n  \"bevy_math/std\",\n  \"serde?/std\",\n  \"wgpu-types?/std\",\n  \"bevy_reflect?/std\",\n]\nalloc = [\"bevy_math/alloc\", \"serde?/alloc\"]\nserialize = [\"serde\", \"bevy_math/serialize\"]\nbevy_reflect = [\"dep:bevy_reflect\"]\nwgpu-types = [\"dep:wgpu-types\"]\nencase = [\"dep:encase\", \"std\"]\nlibm = [\"bevy_math/libm\"]\ncritical-section = [\"bevy_reflect?/critical-section\"]\n\n[lints.clippy]\ndoc_markdown = \"warn\"\nmanual_let_else = \"warn\"\nmatch_same_arms = \"warn\"\nredundant_closure_for_method_calls = \"warn\"\nredundant_else = \"warn\"\nsemicolon_if_nothing_returned = \"warn\"\ntype_complexity = \"allow\"\nundocumented_unsafe_blocks = \"warn\"\nunwrap_or_default = \"warn\"\nneedless_lifetimes = \"allow\"\ntoo_many_arguments = \"allow\"\nnonstandard_macro_braces = \"warn\"\nprint_stdout = \"warn\"\nprint_stderr = \"warn\"\nptr_as_ptr = \"warn\"\nptr_cast_constness = \"warn\"\nref_as_ptr = \"warn\"\ntoo_long_first_doc_paragraph = \"allow\"\nstd_instead_of_core = \"allow\"\nstd_instead_of_alloc = \"warn\"\nalloc_instead_of_core = \"warn\"\nallow_attributes = \"warn\"\nallow_attributes_without_reason = \"warn\"\n\n[lints.rust]\nmissing_docs = \"warn\"\nunexpected_cfgs = { level = \"warn\", check-cfg = ['cfg(docsrs_dep)'] }\nunsafe_code = \"deny\"\nunsafe_op_in_unsafe_fn = \"warn\"\nunused_qualifications = \"warn\"\n\n\n[package.metadata.docs.rs]\nrustdoc-args = [\n  \"-Zunstable-options\",\n  \"--generate-link-to-definition\",\n  \"--generate-macro-expansion\",\n]\nall-features = true\n"
